global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Метрики Spring Boot (Micrometer): HTTP, JVM, пул соединений, бизнес-счётчики
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  # Метрики PostgreSQL
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
