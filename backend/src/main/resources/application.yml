server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: booking-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

# Мониторинг: /actuator/health и /actuator/prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  timezone: ${APP_TIMEZONE:Europe/Moscow}
  open-hour: 9
  close-hour: 21
  admin-token: ${ADMIN_TOKEN:change-me}
